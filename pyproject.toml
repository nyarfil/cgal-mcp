[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cgal-mcp"
version = "0.1.0"
description = "CGAL-wide Master MCP in development, with validated legacy mesh adapters"
requires-python = ">=3.10"
dependencies = ["mcp==2.3.0"]
readme = "README.md"

[project.optional-dependencies]
mesh = ["trimesh==4.12.2"]

[project.scripts]
cgal-mcp = "cgal_mcp.server:main"
cgal-master-mcp = "cgal_mcp.master.server:main"

[tool.setuptools.packages.find]
include = ["cgal_mcp*"]

[tool.setuptools.package-data]
cgal_mcp = ["api_index.json"]
"cgal_mcp.master" = ["*.json", "catalog/*.json", "catalog/*.jsonl"]
