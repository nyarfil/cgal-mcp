[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cgal-mcp"
version = "1.0.0"
description = "CGAL Master MCP: registry-driven, validator-gated CGAL geometry operations over MCP (standalone acceptance pending)"
requires-python = ">=3.10"
dependencies = ["mcp==2.3.0"]
readme = "README.md"

[project.optional-dependencies]
mesh = ["trimesh==4.12.2"]

[project.scripts]
cgal-mcp = "cgal_mcp.master.server:main"
cgal-mcp-legacy = "cgal_mcp.server:main"  # deprecated v0.1 simplification server

[tool.setuptools.packages.find]
include = ["cgal_mcp*"]

[tool.setuptools.package-data]
cgal_mcp = ["api_index.json"]
"cgal_mcp.master" = ["*.json", "catalog/*.json", "catalog/*.jsonl", "guide/*.json"]
