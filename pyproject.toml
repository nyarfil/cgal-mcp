[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cgal-mcp"
version = "0.1.0"
description = "Validated CGAL simplification through a compact MCP router"
requires-python = ">=3.10"
dependencies = ["mcp==2.3.0"]
readme = "README.md"

[project.scripts]
cgal-mcp = "cgal_mcp.server:main"

[tool.setuptools.packages.find]
include = ["cgal_mcp*"]

[tool.setuptools.package-data]
cgal_mcp = ["api_index.json"]
