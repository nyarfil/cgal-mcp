name: Master catalog and acceptance contract
on:
  push:
    paths:
      - 'catalog/**'
      - 'scripts/fetch_master_baseline.py'
      - 'scripts/harvest_cgal.py'
      - 'scripts/build_major_inventory.py'
      - 'scripts/build_master_docs_index.py'
      - 'scripts/sync_master_package_catalog.py'
      - 'scripts/master_acceptance.py'
      - 'tests/test_master_harvester.py'
      - 'tests/test_master_acceptance.py'
      - 'tests/test_master_docs_index.py'
      - 'tests/test_master_inventory.py'
      - 'cgal_mcp/master/catalog/**'
      - 'docs/master/**'
      - '.github/workflows/master-catalog.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check original document bytes and approved requirement denominator
        run: python -m unittest tests.test_master_harvester tests.test_master_acceptance tests.test_master_docs_index tests.test_master_inventory -v
      - name: Check installed package snapshot matches canonical catalog
        run: python scripts/sync_master_package_catalog.py --check
      - uses: actions/cache@v4
        with:
          path: work/master-baseline/archives
          key: cgal-master-release-inputs-6.2.1-b6be77c6-805127da
      - name: Fetch checksummed official source and documentation
        run: python scripts/fetch_master_baseline.py --root work/master-baseline
      - name: Reproduce the complete package snapshot
        run: |
          python scripts/harvest_cgal.py --source work/master-baseline/source/CGAL-6.2.1 --docs work/master-baseline/docs/doc_html --output work/reproduced-catalog
          python -c "from pathlib import Path; names=['baseline.json','packages.json','docs_index.jsonl']; assert all((Path('catalog')/n).read_bytes()==(Path('work/reproduced-catalog')/n).read_bytes() for n in names), 'Catalog snapshot differs from pinned official inputs'"
      - name: Reproduce the provisional major-capability planning inventory
        run: |
          python scripts/build_major_inventory.py --output work/reproduced-major-inventory.json
          python -c "from pathlib import Path; assert Path('catalog/major_capability_inventory.json').read_bytes()==Path('work/reproduced-major-inventory.json').read_bytes(), 'Planning inventory differs from pinned source and original requirements'"
