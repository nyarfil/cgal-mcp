name: Catalog and MCP tests
on:
  push:
    paths:
      - 'cgal_mcp/**'
      - 'worker/**'
      - 'tests/**'
      - 'requirements.txt'
      - 'pyproject.toml'
      - '.github/workflows/**'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[mesh]'
      - name: Compile Python sources
        run: python -m compileall -q cgal_mcp tests scripts
      - run: python -m unittest discover -s tests -v
      - name: MCP continuity after controlled worker faults
        run: |
          python -m tests.master_fault_mcp_e2e auto
          python -m tests.master_fault_mcp_e2e legacy
      - name: Build and verify installed Master outside the checkout
        run: |
          python -m pip wheel . --no-deps --wheel-dir work/wheels
          python scripts/verify_master_package.py --wheel work/wheels/cgal_mcp-0.1.0-py3-none-any.whl
